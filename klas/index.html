<style>

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--ink); background: var(--cream); line-height: 1.5; font-size: 17px; }
header.top { background: var(--em-d); color: #f4efe2; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
header.top b { font-weight: 900; color: var(--gold-l); }
header.top svg.brand-wm { height: 30px; width: auto; display: block; }
#who { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
@media (max-width: 420px) { header.top { padding: 12px 10px; gap: 6px; } header.top svg.brand-wm { height: 22px; } @media (max-width: 340px) { header.top .wm b { display: none; } }
header.top a, header.top button { font-size: 13px; } #who { gap: 7px; } header.top .wm b { font-size: 15px !important; } }
header.top a, header.top button { color: #f4efe2; font: inherit; font-weight: 700; font-size: 15px; background: none; border: 0; text-decoration: underline; cursor: pointer; }
main { max-width: 900px; margin: 0 auto; padding: 18px 16px 60px; }
h1 { font-size: 26px; margin: 8px 0 6px; color: var(--em-d); }
h2 { font-size: 20px; margin: 22px 0 8px; color: var(--em-d); }
p { margin: 6px 0 12px; }
.muted { color: var(--muted); font-size: 15px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin: 10px 0; }
.btn { display: inline-block; font: inherit; font-weight: 800; border: 0; border-radius: 14px; padding: 12px 18px; cursor: pointer; background: var(--em); color: #fff; min-height: 46px; }
.btn.gold { background: linear-gradient(180deg, var(--gold-l), var(--gold)); color: #3b2a07; }
.btn.light { background: #efe6cf; color: var(--em-d); }
.btn.bad { background: #f3dcdf; color: var(--bad); }
.btn.small { padding: 8px 12px; min-height: 38px; font-size: 15px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #ffb703; outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.sp { justify-content: space-between; }
label { display: block; font-weight: 800; margin: 12px 0 4px; font-size: 15px; }
input[type=text], input[type=number], select, textarea { width: 100%; font: inherit; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; background: #fffdf7; color: var(--ink); }
textarea { min-height: 70px; resize: vertical; }
.opt { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.opt input[type=radio] { width: 24px; height: 24px; accent-color: var(--em); flex: none; }
.opt input[type=text] { flex: 1; }
.tag { display: inline-block; background: #efe6cf; color: var(--em-d); border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 800; margin-right: 6px; }
.disc { background: #fff8e0; border: 1px solid #ecd58a; border-radius: 12px; padding: 10px 12px; font-size: 14px; color: #5b4a12; margin: 14px 0; }
.msg { min-height: 24px; font-weight: 700; color: var(--em-d); }
.msg.err { color: var(--bad); }
.q-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.q-head b { flex: 1; }
.hidden { display: none !important; }

.center { text-align: center; } .ar { font-family: "Amiri", serif; font-size: 34px; color: var(--em-d); margin-top: 8px; }
.wait { font-weight: 800; color: var(--em-d); } .rank { font-size: 19px; } .expl { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; text-align: left; }
.good-h { color: var(--em); } .bad-h { color: var(--bad); }
.bigcode { font-size: clamp(44px, 14vw, 84px); font-weight: 900; letter-spacing: .12em; color: var(--em-d); background: #fff; border: 3px solid var(--gold); border-radius: 20px; padding: 6px 12px; margin: 8px auto 14px; display: inline-block; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; } .chip { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 14px; font-weight: 800; }
.chip button { border: 0; background: #f3dcdf; color: var(--bad); border-radius: 50%; width: 28px; height: 28px; margin-left: 6px; cursor: pointer; font-weight: 900; }
.qtop { display: flex; justify-content: space-between; font-weight: 800; color: var(--em-d); margin-top: 6px; } .qtop b { font-size: 22px; }
.bar { height: 12px; background: #e9e0c8; border-radius: 999px; overflow: hidden; margin: 6px 0 12px; } .bar div { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-l)); width: 100%; transition: width .25s linear; }
.qq { font-size: 24px; line-height: 1.3; margin: 10px 0 14px; } .qq.big { font-size: clamp(26px, 5vw, 40px); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0; }
.tile { position: relative; display: flex; align-items: center; gap: 10px; min-height: 84px; padding: 12px 14px; border: 0; border-radius: 16px; color: #fff; font: inherit; font-weight: 800; font-size: 19px; text-align: left; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.22); }
div.tile { cursor: default; } .tile i { font-style: normal; background: rgba(255,255,255,.25); border-radius: 10px; min-width: 34px; height: 34px; display: grid; place-items: center; flex: none; }
.tile em { position: absolute; right: 10px; top: 6px; font-style: normal; background: rgba(0,0,0,.28); border-radius: 999px; padding: 0 9px; font-size: 15px; }
.tile.t0 { background: #2d6a4f; } .tile.t1 { background: #b07a1e; } .tile.t2 { background: #2f5d8a; } .tile.t3 { background: #7a2f3a; }
.tile.mine { outline: 4px solid var(--gold-l); } .tile.dim { opacity: .38; } .tile.good { outline: 5px solid var(--gold-l); }
.tile .chk { position: absolute; right: 10px; bottom: 6px; color: var(--gold-l); font-size: 24px; } .tile:disabled:not(.mine) { opacity: .55; }
.podium { display: flex; justify-content: center; align-items: flex-end; gap: 8px; margin: 18px 0; }
.pod { flex: 1; max-width: 150px; display: flex; flex-direction: column; align-items: center; } .pod b { word-break: break-word; } .pod span { font-size: 14px; color: var(--muted); }
.pod .stars { color: var(--gold); font-size: 24px; letter-spacing: 2px; text-shadow: 0 1px 0 #fff; }
.pod .step { width: 100%; border-radius: 12px 12px 0 0; background: linear-gradient(180deg, var(--gold-l), var(--gold)); color: #3b2a07; font-weight: 900; font-size: 26px; padding-top: 6px; margin-top: 6px; }
.pod.p1 .step { height: 120px; } .pod.p2 .step { height: 84px; } .pod.p3 .step { height: 60px; }
ol.lb { list-style: none; padding: 0; margin: 6px 0 14px; text-align: left; } ol.lb li { display: flex; justify-content: space-between; gap: 14px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; margin: 5px 0; font-weight: 800; } ol.lb li.me { border-color: var(--gold); background: #fff8e0; } ol.lb li > b { flex: none; white-space: nowrap; padding-left: 10px; border-left: 2px solid var(--line); }
.bigval { text-align: center; font-size: 56px; font-weight: 900; color: var(--em-d); } .big-note { font-size: 20px; text-align: center; }
input[type=range] { accent-color: var(--em); height: 36px; }
.cloud { display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: center; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 12px; margin: 10px 0; font-weight: 900; line-height: 1.15; } .cloud sup { font-size: 13px; color: var(--muted); }
.btn.on { background: var(--em); color: #fff; } .vorm-note { min-height: 44px; }
.caravan { margin: 12px 0; } .car-track { position: relative; height: 16px; background: #e9e0c8; border-radius: 999px; margin: 30px 10px 6px; } .car-track i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--gold), var(--gold-l)); transition: width 1.6s ease-in-out; }
.car-m { position: absolute; top: -26px; transform: translateX(-50%); transition: left 1.6s ease-in-out; line-height: 0; } .car-m svg { animation: carBob 1.4s ease-in-out infinite; } @keyframes carBob { 50% { transform: translateY(-4px) rotate(-8deg); } } @media (prefers-reduced-motion: reduce) { .car-m svg { animation: none; } .car-track i, .car-m { transition: none; } } .car-lbl { display: flex; justify-content: space-between; font-weight: 800; color: var(--em-d); font-size: 14px; }
.stars.big { text-align: center; color: var(--gold); font-size: 40px; letter-spacing: 6px; }
.tblw { overflow-x: auto; } .tbl { border-collapse: collapse; width: 100%; background: #fff; border-radius: 12px; font-size: 15px; } .tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; } .tbl td.c, .tbl th { text-align: center; } .tbl td.ok { color: var(--em); font-weight: 900; } .tbl td.no { color: var(--bad); font-weight: 900; } .tbl tr.foot td { background: #fff8e0; font-weight: 800; }
.steps { padding-left: 22px; margin: 8px 0; } .steps li { margin: 6px 0; }
details.help { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; margin: 10px 0; } details.help summary { font-weight: 800; color: var(--em-d); cursor: pointer; min-height: 32px; }
.n3d { display: inline-block; font-weight: 900; font-variant-numeric: tabular-nums; background: linear-gradient(180deg, #fff6c8 0%, #f6d25a 38%, #c8902a 62%, #f3c64f 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
  filter: drop-shadow(1px 0 0 #5a3d08) drop-shadow(-1px 0 0 #5a3d08) drop-shadow(0 1px 0 #5a3d08) drop-shadow(0 -1px 0 #5a3d08) drop-shadow(0 2px 0 #7a5414) drop-shadow(0 3px 0 #7a5414) drop-shadow(0 5px 4px rgba(0,0,0,.35)); }
@keyframes coinPop { 0% { transform: scale(.2) rotate(-40deg); opacity: 0; } 60% { transform: scale(1.25) rotate(8deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
.cburst { position: fixed; width: 0; height: 0; z-index: 60; pointer-events: none; }
.cj { position: absolute; left: -16px; top: -16px; width: 32px; height: 32px; opacity: 0; animation: coinJump 1.5s cubic-bezier(.3,.7,.4,1) forwards; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
@keyframes coinJump { 0% { transform: translate(0,0) scale(.3) rotate(0); opacity: 0; } 12% { opacity: 1; } 45% { transform: translate(calc(var(--dx) * .7), calc(var(--up) * -1)) scale(1.1) rotate(var(--r)); opacity: 1; } 75% { transform: translate(var(--dx), -6px) scale(1) rotate(calc(var(--r) * 1.6)); opacity: 1; } 100% { transform: translate(calc(var(--dx) * 1.1), 14px) scale(.8) rotate(calc(var(--r) * 2)); opacity: 0; } }
@keyframes coinDance { 0%, 100% { transform: translateY(0) rotate(0); } 20% { transform: translateY(-.3em) rotate(-12deg); } 40% { transform: translateY(0) rotate(0); } 60% { transform: translateY(-.2em) rotate(12deg); } 80% { transform: translateY(0) rotate(0); } }
@media (prefers-reduced-motion: reduce) { .cj, .coin { animation: none !important; } }
.coin { animation: coinPop .6s ease-out, coinDance 1.8s ease-in-out .8s infinite; transform-origin: 50% 85%; width: 1.35em; height: 1.35em; vertical-align: -0.2em; margin-right: .25em; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
.h1n { font-size: 1.15em; } .pot { background: linear-gradient(135deg, #fff8e0, #f3e3b0); border: 2px solid #e6cc82; border-radius: 16px; padding: 10px 14px; margin: 12px 0; }
.qimg { display: block; max-width: 100%; max-height: 42vh; margin: 8px auto 12px; border-radius: 14px; border: 1px solid var(--line); object-fit: contain; background: #fff; } .qimg.thumb { max-height: 120px; margin: 6px 0; }
.imgbox { margin: 8px 0; } label.imgbtn { display: inline-block; margin: 6px 0; cursor: pointer; }
main.wide { max-width: 1240px; }
.sbwrap { display: grid; gap: 16px; }
@media (min-width: 900px) { .sbwrap { grid-template-columns: minmax(0, 1fr) 380px; align-items: start; } .sb { position: sticky; top: 10px; } }
.sb { background: #fff; border: 2px solid var(--gold); border-radius: 18px; padding: 12px 14px; }
.sb-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; } .sb-h h2 { margin: 0; }
.sb ol { list-style: none; margin: 8px 0 0; padding: 0; }
.sb li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin: 6px 0; border-radius: 14px; background: var(--cream); border: 1px solid var(--line); font-weight: 800; font-size: clamp(17px, 1.5vw, 24px); }
.sb .rk { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #efe6cf; color: var(--em-d); font-size: .8em; }
.sb li:nth-child(1) .rk { background: linear-gradient(180deg, var(--gold-l), var(--gold)); color: #3b2a07; }
.sb .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.sb .sc { flex: none; text-align: right; line-height: 1.25; } .sb .sc small { display: block; font-size: .62em; color: var(--em); margin-top: 6px; }
.sb .mv { font-size: .7em; } .sb .mv.up { color: var(--em); } .sb .mv.dn { color: var(--bad); }
.sb .done { color: var(--em); font-size: 1.1em; } .sb .wt { color: var(--muted); font-size: .8em; font-weight: 700; }
.sb li.sb-more { background: none; border: 0; justify-content: center; color: var(--muted); font-size: 15px; font-weight: 700; }
@media (max-width: 420px) { .tile { font-size: 17px; min-height: 76px; } }
.kb { display: none; margin: 4px 0 0; } @media (pointer: fine) { .kb { display: block; } }
@media (max-height: 760px) and (min-width: 700px) {
  header.top { padding: 8px 16px; } main { padding: 8px 16px 40px; } h1 { font-size: 24px; margin: 4px 0; } h2 { margin: 14px 0 6px; }
  .qq { font-size: 22px; margin: 6px 0 8px; } .qq.big { font-size: clamp(24px, 3.2vw, 34px); }
  .tile { min-height: 62px; padding: 8px 12px; font-size: 18px; } .tiles { gap: 8px; margin: 6px 0; }
  .qimg { max-height: 26vh; margin: 4px auto 8px; } .bar { margin: 4px 0 8px; } .bigcode { margin: 4px auto 8px; }
  .steps { margin: 4px 0; font-size: 15px; } .steps li { margin: 2px 0; } .jnote { display: none; } label { margin: 8px 0 3px; } .card { padding: 10px 14px; margin: 6px 0; } input[type=text] { padding: 8px 12px; } .msg { min-height: 16px; } .ar { font-size: 28px; margin-top: 2px; }
}

  function listAction(a, id) {
    var q = quizzes.filter(function (x) { return x.id === id; })[0];
    if (!q) return;
    if (a === "hw") { if (!(q.vragen || []).length) { say("Deze quiz heeft nog geen vragen.", true); return; } hwForm(q); return; }
    if (a === "live") { if (!(q.vragen || []).length) { say("Deze quiz heeft nog geen vragen.", true); return; } hostStart(q); return; }
    if (a === "edit") { edit = { id: q.id, titel: q.titel, vragen: JSON.parse(JSON.stringify(q.vragen || [])) }; show(); }
    if (a === "copy") {
      sb.from("klas_quizzen").insert({ titel: q.titel + " (kopie)", vragen: q.vragen }).then(function (r) {
        if (r.error) { say("Kopiëren lukte niet.", true); return; }
        say("Gekopieerd."); loadQuizzes();
      });
    }
    if (a === "del") {
      if (!confirm("Weet je zeker dat je “" + q.titel + "” wilt verwijderen?")) return;
      sb.from("klas_quizzen").delete().eq("id", id).then(function (r) {
        if (r.error) { say("Verwijderen lukte niet.", true); return; }
        say("Verwijderd."); loadQuizzes();
      });
    }
  }

  /* ───── quiz-maker ───── */
  var IMG_BASE = SB_URL + "/storage/v1/object/public/klas-plaatjes/";
  function imgHtml(q) { return q && q.img && String(q.img).indexOf(IMG_BASE) === 0 ? '<img class="qimg" src="' + esc(q.img) + '" alt="Plaatje bij de vraag">' : ""; }
  function shrinkImg(file, max, cb) {
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function () {
      var w = im.naturalWidth, h = im.naturalHeight, s = Math.min(1, max / Math.max(w, h)), c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
      var x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); c.toBlob(function (b) { cb(b); }, "image/jpeg", 0.82);
    };
    im.onerror = function () { URL.revokeObjectURL(url); cb(null); };
    im.src = url;
  }
  function uploadImg(i, file) {
    edit.titel = (document.getElementById("titel") || {}).value || edit.titel;
    say("Plaatje wordt klaargemaakt…");
    shrinkImg(file, 800, function (blob) {
      if (!blob) { say("Dit plaatje kan ik niet openen. Kies een JPG of PNG.", true); return; }
      var path = user.id + "/" + uid() + ".jpg";
      sb.storage.from("klas-plaatjes").upload(path, blob, { contentType: "image/jpeg", upsert: false }).then(function (r) {
        if (r.error) { say("Plaatje uploaden lukte niet. Is de database klaargezet?", true); return; }
        edit.vragen[i].img = sb.storage.from("klas-plaatjes").getPublicUrl(path).data.publicUrl; show();
      }, function () { say("Plaatje uploaden lukte niet.", true); });
    });
  }
  var TYPES = { mc: "Meerkeuze", tf: "Waar / niet waar", type: "Typ het antwoord", order: "Juiste volgorde", slider: "Schuifbalk", poll: "Peiling", cloud: "Woordwolk" };
  function newQ(type) {
    var q = { id: uid(), t: type, q: "", time: 20, pts: 1, e: "" };
    if (type === "mc") { q.o = ["", "", "", ""]; q.a = 0; }
    else if (type === "tf") { q.o = ["Waar", "Niet waar"]; q.a = 0; }
    else if (type === "type") { q.o = ["", "", "", ""]; q.time = 30; }
    else if (type === "order") { q.o = ["", "", "", "", ""]; q.time = 30; }
    else if (type === "slider") { q.min = 0; q.max = 100; q.a = 50; q.tol = 0; q.time = 30; }
    else if (type === "poll") { q.o = ["", "", "", ""]; q.pts = 0; }
    else if (type === "cloud") { q.pts = 0; q.time = 30; }

  async function applyGifts(qi) {
