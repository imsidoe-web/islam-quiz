<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NurSpark Klas – maak je eigen quiz</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b4332">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root { --em: #2d6a4f; --em-d: #1b4332; --gold: #d9a05b; --gold-l: #f6d25a; --cream: #fbf7ec; --ink: #1f2a24; --muted: #4a5a50; --line: #e6dcc3; --bad: #8a2f3a; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--ink); background: var(--cream); line-height: 1.5; font-size: 17px; }
header.top { background: var(--em-d); color: #f4efe2; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
header.top b { font-weight: 900; color: var(--gold-l); }
header.top svg.brand-wm { height: 30px; width: auto; display: block; }
header.top a, header.top button { color: #f4efe2; font: inherit; font-weight: 700; font-size: 15px; background: none; border: 0; text-decoration: underline; cursor: pointer; }
main { max-width: 720px; margin: 0 auto; padding: 18px 16px 60px; }
h1 { font-size: 26px; margin: 8px 0 6px; color: var(--em-d); }
h2 { font-size: 20px; margin: 22px 0 8px; color: var(--em-d); }
p { margin: 6px 0 12px; }
.muted { color: var(--muted); font-size: 15px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin: 10px 0; }
.btn { display: inline-block; font: inherit; font-weight: 800; border: 0; border-radius: 14px; padding: 12px 18px; cursor: pointer; background: var(--em); color: #fff; min-height: 46px; }
.btn.gold { background: linear-gradient(180deg, var(--gold-l), var(--gold)); color: #3b2a07; }
.btn.light { background: #efe6cf; color: var(--em-d); }
.btn.bad { background: #f3dcdf; color: var(--bad); }
.btn.small { padding: 8px 12px; min-height: 38px; font-size: 15px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #ffb703; outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.sp { justify-content: space-between; }
label { display: block; font-weight: 800; margin: 12px 0 4px; font-size: 15px; }
input[type=text], input[type=number], select, textarea { width: 100%; font: inherit; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; background: #fffdf7; color: var(--ink); }
textarea { min-height: 70px; resize: vertical; }
.opt { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.opt input[type=radio] { width: 24px; height: 24px; accent-color: var(--em); flex: none; }
.opt input[type=text] { flex: 1; }
.tag { display: inline-block; background: #efe6cf; color: var(--em-d); border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 800; margin-right: 6px; }
.disc { background: #fff8e0; border: 1px solid #ecd58a; border-radius: 12px; padding: 10px 12px; font-size: 14px; color: #5b4a12; margin: 14px 0; }
.msg { min-height: 24px; font-weight: 700; color: var(--em-d); }
.msg.err { color: var(--bad); }
.q-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.q-head b { flex: 1; }
.hidden { display: none !important; }

.center { text-align: center; } .ar { font-family: "Amiri", serif; font-size: 34px; color: var(--em-d); margin-top: 8px; }
.wait { font-weight: 800; color: var(--em-d); } .rank { font-size: 19px; } .expl { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; text-align: left; }
.good-h { color: var(--em); } .bad-h { color: var(--bad); }
.bigcode { font-size: clamp(44px, 14vw, 84px); font-weight: 900; letter-spacing: .12em; color: var(--em-d); background: #fff; border: 3px solid var(--gold); border-radius: 20px; padding: 6px 12px; margin: 8px auto 14px; display: inline-block; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; } .chip { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 14px; font-weight: 800; }
.chip button { border: 0; background: #f3dcdf; color: var(--bad); border-radius: 50%; width: 28px; height: 28px; margin-left: 6px; cursor: pointer; font-weight: 900; }
.qtop { display: flex; justify-content: space-between; font-weight: 800; color: var(--em-d); margin-top: 6px; } .qtop b { font-size: 22px; }
.bar { height: 12px; background: #e9e0c8; border-radius: 999px; overflow: hidden; margin: 6px 0 12px; } .bar div { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-l)); width: 100%; transition: width .25s linear; }
.qq { font-size: 24px; line-height: 1.3; margin: 10px 0 14px; } .qq.big { font-size: clamp(26px, 5vw, 40px); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0; }
.tile { position: relative; display: flex; align-items: center; gap: 10px; min-height: 84px; padding: 12px 14px; border: 0; border-radius: 16px; color: #fff; font: inherit; font-weight: 800; font-size: 19px; text-align: left; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.22); }
div.tile { cursor: default; } .tile i { font-style: normal; background: rgba(255,255,255,.25); border-radius: 10px; min-width: 34px; height: 34px; display: grid; place-items: center; flex: none; }
.tile em { position: absolute; right: 10px; top: 6px; font-style: normal; background: rgba(0,0,0,.28); border-radius: 999px; padding: 0 9px; font-size: 15px; }
.tile.t0 { background: #2d6a4f; } .tile.t1 { background: #b07a1e; } .tile.t2 { background: #2f5d8a; } .tile.t3 { background: #7a2f3a; }
.tile.mine { outline: 4px solid var(--gold-l); } .tile.dim { opacity: .38; } .tile.good { outline: 5px solid var(--gold-l); }
.tile .chk { position: absolute; right: 10px; bottom: 6px; color: var(--gold-l); font-size: 24px; } .tile:disabled:not(.mine) { opacity: .55; }
.podium { display: flex; justify-content: center; align-items: flex-end; gap: 8px; margin: 18px 0; }
.pod { flex: 1; max-width: 150px; display: flex; flex-direction: column; align-items: center; } .pod b { word-break: break-word; } .pod span { font-size: 14px; color: var(--muted); }
.pod .stars { color: var(--gold); font-size: 24px; letter-spacing: 2px; text-shadow: 0 1px 0 #fff; }
.pod .step { width: 100%; border-radius: 12px 12px 0 0; background: linear-gradient(180deg, var(--gold-l), var(--gold)); color: #3b2a07; font-weight: 900; font-size: 26px; padding-top: 6px; margin-top: 6px; }
.pod.p1 .step { height: 120px; } .pod.p2 .step { height: 84px; } .pod.p3 .step { height: 60px; }
ol.lb { list-style: none; padding: 0; margin: 6px 0 14px; text-align: left; } ol.lb li { display: flex; justify-content: space-between; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; margin: 5px 0; font-weight: 800; } ol.lb li.me { border-color: var(--gold); background: #fff8e0; }
.bigval { text-align: center; font-size: 56px; font-weight: 900; color: var(--em-d); } .big-note { font-size: 20px; text-align: center; }
input[type=range] { accent-color: var(--em); height: 36px; }
@media (max-width: 420px) { .tile { font-size: 17px; min-height: 76px; } }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  "use strict";
  var SB_URL = "https://mkjqaahxyljmczpinpvc.supabase.co";
  var SB_KEY = "sb_publishable_cJ7mtK6JKPs9fMkT6U6shw_pTwJbwmi";
  var sb = null, user = null, quizzes = [], edit = null, msg = "", msgErr = false;
  var app = document.getElementById("app"), who = document.getElementById("who");
  var DISC = "Jij bent zelf verantwoordelijk voor de inhoud van je quizzen. Ze zijn alleen voor jouw eigen klas en worden nooit openbaar in NurSpark.";

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function say(t, err) { msg = t || ""; msgErr = !!err; var m = document.getElementById("msg"); if (m) { m.textContent = msg; m.className = "msg" + (msgErr ? " err" : ""); } }

  try { sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { flowType: "pkce", persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }); } catch (e) { sb = null; }

  function initSb() {
    if (!sb) { show(); return; }
    sb.auth.getSession().then(function (r) {
      var s = r && r.data && r.data.session;
      user = s && s.user && !s.user.is_anonymous ? s.user : null;
      if (user) loadQuizzes(); else show();
    });
    sb.auth.onAuthStateChange(function (ev, s) {
      var u = s && s.user && !s.user.is_anonymous ? s.user : null;
      if (u && (!user || user.id !== u.id)) { user = u; loadQuizzes(); }
      if (!u && user) { user = null; show(); }
    });
  }
  function start() {
    prefill = (new URLSearchParams(location.search).get("c") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    var saved = lsGet(LLN_KEY);
    if (saved && (!prefill || prefill === saved.code)) resumeLeerling(saved).then(initSb); else initSb();
  }

  function loadQuizzes() {
    sb.from("klas_quizzen").select("id,titel,vragen,updated_at").order("updated_at", { ascending: false }).then(function (r) {
      if (r.error) { quizzes = []; show(); say("Je quizzen konden niet geladen worden. Is de database al klaargezet?", true); return; }
      quizzes = r.data || []; show();
    });
  }

  /* ───── schermen ───── */
  function show() {
    who.innerHTML = user ? '<button type="button" id="out">Uitloggen</button>' : "";
    if (user) document.getElementById("out").onclick = function () { stopAll(); lsSet(HOST_KEY, null); sb.auth.signOut().then(function () { user = null; edit = null; show(); }); };
    if (L) return renderL();
    if (G) return renderG();
    if (!user) return showLogin();
    if (edit) return showEditor();
    showList();
  }

  function showLogin() {
    app.innerHTML = '<h1>Welkom bij NurSpark Klas</h1>' +
      '<div class="card"><h2 style="margin-top:0">Ik ben leerling</h2><label for="jc">Code van je docent</label>' +
      '<input type="text" id="jc" maxlength="6" autocomplete="off" autocapitalize="characters" value="' + esc(prefill) + '" placeholder="Bijvoorbeeld K7M2QX">' +
      '<label for="jn">Jouw bijnaam (max. 14 tekens)</label><input type="text" id="jn" maxlength="14" autocomplete="off" placeholder="Bijvoorbeeld Sterretje">' +
      '<p class="muted">Kies een bijnaam, geen volledige naam. Je hebt geen account nodig.</p><div id="jmsg" class="msg"></div>' +
      '<button class="btn gold" id="joinBtn" type="button">Meedoen</button></div>' +
      '<div class="card"><h2 style="margin-top:0">Ik ben docent</h2><p>Maak je eigen quiz en speel hem live met je klas.</p>' +
      '<button class="btn" id="g" type="button">Inloggen met Google</button><div id="msg" class="msg"></div></div>' +
      '<div class="disc">' + esc(DISC) + '</div>';
    var jc = document.getElementById("jc"), jn = document.getElementById("jn");
    var go = function () { joinGame(jc.value, jn.value); };
    document.getElementById("joinBtn").onclick = go;
    [jc, jn].forEach(function (el) { el.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); }); });
    if (prefill) jn.focus();
    document.getElementById("g").onclick = function () {
      if (!sb) { say("Inloggen lukt nu niet. Probeer het later opnieuw.", true); return; }
      sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + location.pathname } }).then(function (r) {
        if (r && r.error) say("Inloggen lukt nu niet. Probeer het later opnieuw.", true);
      });
    };
  }

  function showList() {
    var h = '<h1>Mijn quizzen</h1><div class="row sp"><span class="muted">' + quizzes.length + ' quiz' + (quizzes.length === 1 ? "" : "zen") + '</span>' +
      '<button class="btn gold" id="new" type="button">+ Nieuwe quiz</button></div><div id="msg" class="msg"></div>';
    var hs = lsGet(HOST_KEY);
    if (hs) h += '<div class="card"><p><b>Je hebt een lopend spel</b> (code ' + esc(hs.code) + ').</p><div class="row"><button class="btn small gold" id="resume" type="button">Hervatten</button><button class="btn small bad" id="dropgame" type="button">Wissen</button></div></div>';
    if (!quizzes.length) h += '<div class="card"><p>Je hebt nog geen quiz. Tik op <b>+ Nieuwe quiz</b> om te beginnen.</p></div>';
    quizzes.forEach(function (q) {
      var n = (q.vragen || []).length;
      h += '<div class="card"><div class="q-head"><b>' + esc(q.titel) + '</b><span class="tag">' + n + ' vragen</span></div>' +
        '<div class="row" style="margin-top:10px"><button class="btn small gold" data-a="live" data-id="' + esc(q.id) + '" type="button">Live spelen</button><button class="btn small" data-a="edit" data-id="' + esc(q.id) + '" type="button">Bewerken</button>' +
        '<button class="btn small light" data-a="copy" data-id="' + esc(q.id) + '" type="button">Kopiëren</button>' +
        '<button class="btn small bad" data-a="del" data-id="' + esc(q.id) + '" type="button">Verwijderen</button></div></div>';
    });
    h += '<div class="disc">' + esc(DISC) + '</div>';
    app.innerHTML = h;
    var rs = document.getElementById("resume");
    if (rs) { rs.onclick = function () { rs.disabled = true; resumeHost().then(function (ok) { if (!ok) { say("Dit spel kon niet worden hervat.", true); rs.disabled = false; } }); }; }
    var dg = document.getElementById("dropgame");
    if (dg) dg.onclick = function () { lsSet(HOST_KEY, null); show(); };
    document.getElementById("new").onclick = function () { edit = { id: null, titel: "", vragen: [] }; show(); };
    app.querySelectorAll("[data-a]").forEach(function (b) {
      b.onclick = function () { listAction(b.getAttribute("data-a"), b.getAttribute("data-id")); };
    });
    if (msg) { say(msg, msgErr); msg = ""; }
  }

  function listAction(a, id) {
    var q = quizzes.filter(function (x) { return x.id === id; })[0];
    if (!q) return;
    if (a === "live") { if (!(q.vragen || []).length) { say("Deze quiz heeft nog geen vragen.", true); return; } hostStart(q); return; }
    if (a === "edit") { edit = { id: q.id, titel: q.titel, vragen: JSON.parse(JSON.stringify(q.vragen || [])) }; show(); }
    if (a === "copy") {
      sb.from("klas_quizzen").insert({ titel: q.titel + " (kopie)", vragen: q.vragen }).then(function (r) {
        if (r.error) { say("Kopiëren lukte niet.", true); return; }
        say("Gekopieerd."); loadQuizzes();
      });
    }
    if (a === "del") {

  /* ───── docent: spel leiden ───── */
  async function hostStart(quiz) {

  function attachHost(code, quiz, state, qi, pub) {
    stopAll();

    G.ls.push(listen("klas/" + code + "/spelers", function (d) { G.players = d || {}; if (G.state === "lobby" || G.state === "einde") renderG(); else updAns(); }));

  async function resumeHost() {

    try {
      var meta = await dbReq("GET", "klas/" + s.code + "/meta");
      var pub = await dbReq("GET", "klas/" + s.code + "/vragen");
      if (!meta || !quiz || !pub) { lsSet(HOST_KEY, null); return false; }
      attachHost(s.code, quiz, meta.state, meta.qi, Array.isArray(pub) ? pub : Object.keys(pub).map(function (x) { return pub[x]; }));
      if (meta.state === "vraag") { G.qStart = Date.now(); G.closed = false; await hostClose(); }
      else if (meta.state === "uitslag") {
        var ant = (await dbReq("GET", "klas/" + G.code + "/ant/" + meta.qi)) || {};

  /* beoordeel de antwoorden van één vraag */
  function evalQ(qi, ant) {
    var q = G.quiz.vragen[qi], kk = keyOf(q, G.pub[qi]), per = {};
    var st = { counts: (q.t === "mc" || q.t === "tf") ? q.o.map(function () { return 0; }) : null, ok: 0, total: 0, texts: {}, text: kk.text };
    Object.keys(G.players).forEach(function (u) {
      var p = G.players[u]; if (!p || !p.name) return;
      st.total++;
      var a = ant[u], valid = validAns(q, a), ok = valid && isOk(q, kk.key, a);
      if (valid) { if (st.counts) st.counts[a]++; else { var s2 = String(a); st.texts[s2] = (st.texts[s2] || 0) + 1; } }
      if (ok) st.ok++;
      per[u] = { valid: valid, ok: !!ok, k: valid ? (typeof a === "number" ? a : 0) : -1 };
    });
    return { per: per, st: st };

  async function hostAsk(i) {

    try { await dbReq("PATCH", "klas/" + G.code + "/meta", { state: "vraag", qi: i, a: null, e: null }); } catch (e) { say("Dat lukte niet. Probeer opnieuw.", true); G.state = "uitslag"; return; }

    }
    if (st === "uitslag") {
      var last = G.qi + 1 >= G.quiz.vragen.length, sx = G.stat || { counts: null, ok: 0, total: 0, texts: {}, text: "" }, ub = "";
      if (q.t === "mc" || q.t === "tf") ub = tilesHtml(q, { ok: q.a, counts: sx.counts });
      else {
        ub = '<div class="card center"><p class="muted" style="margin:0">Het goede antwoord</p><h2 style="margin:4px 0">' + esc(sx.text) + '</h2><p style="margin:0"><b>' + sx.ok + '</b> van ' + sx.total + ' goed</p></div>';
        if (q.t === "type" || q.t === "slider") {
          var tx = Object.keys(sx.texts).sort(function (x, y) { return sx.texts[y] - sx.texts[x]; }).slice(0, 8);
          if (tx.length) ub += '<p class="muted">Gegeven antwoorden:</p><div class="chips">' + tx.map(function (t2) { return '<span class="chip">' + esc(t2) + ' · ' + sx.texts[t2] + '×</span>'; }).join("") + '</div>';
        }
      }
      app.innerHTML = '<div class="qtop"><span>Uitslag vraag ' + (G.qi + 1) + '</span></div><h1 class="qq big">' + esc(q.q) + '</h1>' + ub +
        (q.e ? '<p class="expl">' + esc(q.e) + '</p>' : "") + '<h2>Tussenstand</h2>' + listHtml(rk, 5) + '<div id="msg" class="msg"></div>' +
        '<button class="btn gold" id="nx" type="button">' + (last ? "Naar het podium" : "Volgende vraag") + '</button>';
      document.getElementById("nx").onclick = function () { this.disabled = true; hostNext(); }; return;
    }
    if (st === "einde") {
      app.innerHTML = '<div class="center"><h1>MashaAllah! Het podium</h1>' + podiumHtml(rk) + '<h2>Alle spelers</h2>' + listHtml(rk, 50) + '<div class="row" style="justify-content:center;margin-top:14px"><button class="btn gold" id="fin" type="button">Spel afsluiten</button></div></div>';
      document.getElementById("fin").onclick = function () { if (confirm("Het spel afsluiten? De scores worden gewist.")) hostStop(); };
    }
  }

  start();
})();
</script>
</body>
</html>
