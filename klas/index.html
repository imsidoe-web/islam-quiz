<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NurSpark Klas – maak je eigen quiz</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b4332">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root { --em: #2d6a4f; --em-d: #1b4332; --gold: #d9a05b; --gold-l: #f6d25a; --cream: #fbf7ec; --ink: #1f2a24; --muted: #4a5a50; --line: #e6dcc3; --bad: #8a2f3a; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--ink); background: var(--cream); line-height: 1.5; font-size: 17px; }
header.top { background: var(--em-d); color: #f4efe2; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
header.top b { font-size: 20px; font-weight: 900; }
header.top b span { color: var(--gold-l); }
header.top a, header.top button { color: #f4efe2; font: inherit; font-weight: 700; font-size: 15px; background: none; border: 0; text-decoration: underline; cursor: pointer; }
main { max-width: 720px; margin: 0 auto; padding: 18px 16px 60px; }
h1 { font-size: 26px; margin: 8px 0 6px; color: var(--em-d); }
h2 { font-size: 20px; margin: 22px 0 8px; color: var(--em-d); }
p { margin: 6px 0 12px; }
.muted { color: var(--muted); font-size: 15px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin: 10px 0; }
.btn { display: inline-block; font: inherit; font-weight: 800; border: 0; border-radius: 14px; padding: 12px 18px; cursor: pointer; background: var(--em); color: #fff; min-height: 46px; }
.btn.gold { background: linear-gradient(180deg, var(--gold-l), var(--gold)); color: #3b2a07; }
.btn.light { background: #efe6cf; color: var(--em-d); }
.btn.bad { background: #f3dcdf; color: var(--bad); }
.btn.small { padding: 8px 12px; min-height: 38px; font-size: 15px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #ffb703; outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.sp { justify-content: space-between; }
label { display: block; font-weight: 800; margin: 12px 0 4px; font-size: 15px; }
input[type=text], input[type=number], select, textarea { width: 100%; font: inherit; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; background: #fffdf7; color: var(--ink); }
textarea { min-height: 70px; resize: vertical; }
.opt { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.opt input[type=radio] { width: 24px; height: 24px; accent-color: var(--em); flex: none; }
.opt input[type=text] { flex: 1; }
.tag { display: inline-block; background: #efe6cf; color: var(--em-d); border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 800; margin-right: 6px; }
.disc { background: #fff8e0; border: 1px solid #ecd58a; border-radius: 12px; padding: 10px 12px; font-size: 14px; color: #5b4a12; margin: 14px 0; }
.msg { min-height: 24px; font-weight: 700; color: var(--em-d); }
.msg.err { color: var(--bad); }
.q-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.q-head b { flex: 1; }
.hidden { display: none !important; }
</style>
</head>
<body>
<header class="top">
  <b>Nur<span>Spark</span> Klas</b>
  <span id="who"></span>
</header>
<main id="app" aria-live="polite"><p>Even laden…</p></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  "use strict";
  var SB_URL = "https://mkjqaahxyljmczpinpvc.supabase.co";
  var SB_KEY = "sb_publishable_cJ7mtK6JKPs9fMkT6U6shw_pTwJbwmi";
  var sb = null, user = null, quizzes = [], edit = null, msg = "", msgErr = false;
  var app = document.getElementById("app"), who = document.getElementById("who");
  var DISC = "Jij bent zelf verantwoordelijk voor de inhoud van je quizzen. Ze zijn alleen voor jouw eigen klas en worden nooit openbaar in NurSpark.";

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function say(t, err) { msg = t || ""; msgErr = !!err; var m = document.getElementById("msg"); if (m) { m.textContent = msg; m.className = "msg" + (msgErr ? " err" : ""); } }

  try { sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { flowType: "pkce", persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }); } catch (e) { sb = null; }

  function start() {
    if (!sb) { app.innerHTML = '<p class="msg err">De verbinding kon niet laden. Probeer het later opnieuw.</p>'; return; }
    sb.auth.getSession().then(function (r) {
      var s = r && r.data && r.data.session;
      user = s && s.user && !s.user.is_anonymous ? s.user : null;
      if (user) loadQuizzes(); else show();
    });
    sb.auth.onAuthStateChange(function (ev, s) {
      var u = s && s.user && !s.user.is_anonymous ? s.user : null;
      if (u && (!user || user.id !== u.id)) { user = u; loadQuizzes(); }
      if (!u && user) { user = null; show(); }
    });
  }

  function loadQuizzes() {
    sb.from("klas_quizzen").select("id,titel,vragen,updated_at").order("updated_at", { ascending: false }).then(function (r) {
      if (r.error) { quizzes = []; show(); say("Je quizzen konden niet geladen worden. Is de database al klaargezet?", true); return; }
      quizzes = r.data || []; show();
    });
  }

  /* ───── schermen ───── */
  function show() {
    who.innerHTML = user ? '<button type="button" id="out">Uitloggen</button>' : "";
    if (user) document.getElementById("out").onclick = function () { sb.auth.signOut().then(function () { user = null; edit = null; show(); }); };
    if (!user) return showLogin();
    if (edit) return showEditor();
    showList();
  }

  function showLogin() {
    app.innerHTML = '<h1>Maak je eigen quiz voor de klas</h1>' +
      '<p>Bismillah. Hier maak je als docent een quiz met je eigen vragen en antwoorden. Later speel je die live met je klas of geef je hem als huiswerk.</p>' +
      '<div class="card"><p><b>Inloggen met Google</b> (alleen voor docenten). Leerlingen hebben geen account nodig.</p>' +
      '<button class="btn gold" id="g" type="button">Inloggen met Google</button><div id="msg" class="msg"></div></div>' +
      '<div class="disc">' + esc(DISC) + '</div>';
    document.getElementById("g").onclick = function () {
      sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + location.pathname } }).then(function (r) {
        if (r && r.error) say("Inloggen lukt nu niet. Probeer het later opnieuw.", true);
      });
    };
  }

  function showList() {
    var h = '<h1>Mijn quizzen</h1><div class="row sp"><span class="muted">' + quizzes.length + ' quiz' + (quizzes.length === 1 ? "" : "zen") + '</span>' +
      '<button class="btn gold" id="new" type="button">+ Nieuwe quiz</button></div><div id="msg" class="msg"></div>';
    if (!quizzes.length) h += '<div class="card"><p>Je hebt nog geen quiz. Tik op <b>+ Nieuwe quiz</b> om te beginnen.</p></div>';
    quizzes.forEach(function (q) {
      var n = (q.vragen || []).length;
      h += '<div class="card"><div class="q-head"><b>' + esc(q.titel) + '</b><span class="tag">' + n + ' vragen</span></div>' +
        '<div class="row" style="margin-top:10px"><button class="btn small" data-a="edit" data-id="' + esc(q.id) + '" type="button">Bewerken</button>' +
        '<button class="btn small light" data-a="copy" data-id="' + esc(q.id) + '" type="button">Kopiëren</button>' +
        '<button class="btn small bad" data-a="del" data-id="' + esc(q.id) + '" type="button">Verwijderen</button></div></div>';
    });
    h += '<div class="disc">' + esc(DISC) + '</div>';
    app.innerHTML = h;
    document.getElementById("new").onclick = function () { edit = { id: null, titel: "", vragen: [] }; show(); };
    app.querySelectorAll("[data-a]").forEach(function (b) {
      b.onclick = function () { listAction(b.getAttribute("data-a"), b.getAttribute("data-id")); };
    });
    if (msg) { say(msg, msgErr); msg = ""; }
  }

  function listAction(a, id) {
    var q = quizzes.filter(function (x) { return x.id === id; })[0];
    if (!q) return;
    if (a === "edit") { edit = { id: q.id, titel: q.titel, vragen: JSON.parse(JSON.stringify(q.vragen || [])) }; show(); }
    if (a === "copy") {
      sb.from("klas_quizzen").insert({ titel: q.titel + " (kopie)", vragen: q.vragen }).then(function (r) {
        if (r.error) { say("Kopiëren lukte niet.", true); return; }
        say("Gekopieerd."); loadQuizzes();
      });
    }
    if (a === "del") {
      if (!confirm("Weet je zeker dat je “" + q.titel + "” wilt verwijderen?")) return;
      sb.from("klas_quizzen").delete().eq("id", id).then(function (r) {
        if (r.error) { say("Verwijderen lukte niet.", true); return; }
        say("Verwijderd."); loadQuizzes();
      });
    }
  }

  /* ───── quiz-maker ───── */
  function newQ(type) {
    return { id: uid(), t: type, q: "", o: type === "tf" ? ["Waar", "Niet waar"] : ["", "", "", ""], a: 0, time: 20, pts: 1, e: "" };
  }

  function showEditor() {
    var h = '<div class="row sp"><h1 style="margin:0">' + (edit.id ? "Quiz bewerken" : "Nieuwe quiz") + '</h1></div>' +
      '<label for="titel">Naam van de quiz</label><input type="text" id="titel" maxlength="60" value="' + esc(edit.titel) + '" placeholder="Bijvoorbeeld: De vijf zuilen">' +
      '<h2>Vragen (' + edit.vragen.length + ')</h2>';
    edit.vragen.forEach(function (q, i) {
      h += '<div class="card" data-i="' + i + '"><div class="q-head"><b>Vraag ' + (i + 1) + ' · ' + (q.t === "tf" ? "Waar / niet waar" : "Meerkeuze") + '</b>' +
        '<span class="row"><button class="btn small light" data-m="up" data-i="' + i + '" type="button" aria-label="Omhoog"' + (i === 0 ? " disabled" : "") + '>↑</button>' +
        '<button class="btn small light" data-m="down" data-i="' + i + '" type="button" aria-label="Omlaag"' + (i === edit.vragen.length - 1 ? " disabled" : "") + '>↓</button>' +
        '<button class="btn small bad" data-m="rm" data-i="' + i + '" type="button" aria-label="Vraag verwijderen">✕</button></span></div>' +
        '<label for="q' + i + '">Vraag</label><textarea id="q' + i + '" data-f="q" data-i="' + i + '" maxlength="240">' + esc(q.q) + '</textarea>' +
        '<label>Antwoorden (tik de cirkel bij het goede antwoord)</label>';
      q.o.forEach(function (o, k) {
        h += '<div class="opt"><input type="radio" name="a' + i + '" data-f="a" data-i="' + i + '" data-k="' + k + '"' + (q.a === k ? " checked" : "") + ' aria-label="Goed antwoord ' + (k + 1) + '">' +
          (q.t === "tf" ? '<span style="font-weight:800">' + esc(o) + '</span>' :
            '<input type="text" data-f="o" data-i="' + i + '" data-k="' + k + '" maxlength="80" value="' + esc(o) + '" placeholder="Antwoord ' + (k + 1) + (k >= 2 ? " (mag leeg)" : "") + '" aria-label="Antwoord ' + (k + 1) + '">') + '</div>';
      });
      h += '<div class="row" style="margin-top:6px"><div style="flex:1;min-width:130px"><label for="t' + i + '">Tijd (5–120 sec)</label>' +
        '<input type="number" id="t' + i + '" data-f="time" data-i="' + i + '" min="5" max="120" value="' + q.time + '"></div>' +
        '<div style="flex:1;min-width:150px"><label for="p' + i + '">Punten</label><select id="p' + i + '" data-f="pts" data-i="' + i + '">' +
        '<option value="1"' + (q.pts === 1 ? " selected" : "") + '>Normaal</option><option value="2"' + (q.pts === 2 ? " selected" : "") + '>Dubbel</option><option value="0"' + (q.pts === 0 ? " selected" : "") + '>Zonder punten</option></select></div></div>' +
        '<label for="e' + i + '">Uitleg na de vraag (mag leeg)</label><textarea id="e' + i + '" data-f="e" data-i="' + i + '" maxlength="300">' + esc(q.e) + '</textarea></div>';
    });
    h += '<div class="row"><button class="btn light" id="addmc" type="button">+ Meerkeuze</button><button class="btn light" id="addtf" type="button">+ Waar / niet waar</button></div>' +
      '<div class="disc">' + esc(DISC) + '</div><div id="msg" class="msg"></div>' +
      '<div class="row"><button class="btn gold" id="save" type="button">Opslaan</button><button class="btn light" id="cancel" type="button">Terug</button></div>';
    app.innerHTML = h;

    app.querySelectorAll("[data-f]").forEach(function (el) {
      var f = el.getAttribute("data-f"), i = +el.getAttribute("data-i"), k = +el.getAttribute("data-k");
      var h2 = function () {
        var q = edit.vragen[i];
        if (f === "q") q.q = el.value; else if (f === "e") q.e = el.value;
        else if (f === "o") q.o[k] = el.value;
        else if (f === "a") q.a = k;
        else if (f === "time") q.time = Math.max(5, Math.min(120, parseInt(el.value, 10) || 20));
        else if (f === "pts") q.pts = parseInt(el.value, 10);
      };
      el.addEventListener(f === "a" || f === "pts" ? "change" : "input", h2);
    });
    app.querySelectorAll("[data-m]").forEach(function (b) {
      b.onclick = function () {
        var i = +b.getAttribute("data-i"), m = b.getAttribute("data-m"), v = edit.vragen;
        edit.titel = document.getElementById("titel").value;
        if (m === "rm") { if (!confirm("Deze vraag verwijderen?")) return; v.splice(i, 1); }
        if (m === "up" && i > 0) { var t = v[i]; v[i] = v[i - 1]; v[i - 1] = t; }
        if (m === "down" && i < v.length - 1) { var t2 = v[i]; v[i] = v[i + 1]; v[i + 1] = t2; }
        show();
      };
    });
    document.getElementById("titel").addEventListener("input", function (e) { edit.titel = e.target.value; });
    document.getElementById("addmc").onclick = function () { edit.titel = document.getElementById("titel").value; edit.vragen.push(newQ("mc")); show(); focusLast(); };
    document.getElementById("addtf").onclick = function () { edit.titel = document.getElementById("titel").value; edit.vragen.push(newQ("tf")); show(); focusLast(); };
    document.getElementById("cancel").onclick = function () { if (confirm("Terug zonder opslaan?")) { edit = null; show(); } };
    document.getElementById("save").onclick = save;
  }

  function focusLast() {
    var els = app.querySelectorAll("textarea[data-f=q]");
    if (els.length) { var l = els[els.length - 1]; l.scrollIntoView({ block: "center" }); l.focus(); }
  }

  function save() {
    var titel = document.getElementById("titel").value.trim();
    if (!titel) { say("Geef je quiz een naam.", true); return; }
    if (!edit.vragen.length) { say("Voeg minstens één vraag toe.", true); return; }
    var clean = [];
    for (var i = 0; i < edit.vragen.length; i++) {
      var q = edit.vragen[i], n = i + 1;
      if (!q.q.trim()) { say("Vraag " + n + " heeft nog geen tekst.", true); return; }
      var o = q.t === "tf" ? q.o.slice() : q.o.map(function (x) { return x.trim(); });
      if (q.t === "mc") {
        if (!o[0] || !o[1]) { say("Vraag " + n + " heeft minstens 2 antwoorden nodig (antwoord 1 en 2).", true); return; }
        /* lege antwoorden 3 en 4 weglaten; goed antwoord moet ingevuld zijn */
        var keep = [], map = {};
        o.forEach(function (x, k) { if (x) { map[k] = keep.length; keep.push(x); } });
        if (map[q.a] === undefined) { say("Vraag " + n + ": het goede antwoord is leeg.", true); return; }
        clean.push({ id: q.id, t: "mc", q: q.q.trim(), o: keep, a: map[q.a], time: q.time, pts: q.pts, e: (q.e || "").trim() });
      } else {
        clean.push({ id: q.id, t: "tf", q: q.q.trim(), o: ["Waar", "Niet waar"], a: q.a === 1 ? 1 : 0, time: q.time, pts: q.pts, e: (q.e || "").trim() });
      }
    }
    var btn = document.getElementById("save"); btn.disabled = true; say("Bezig met opslaan…");
    var row = { titel: titel, vragen: clean, updated_at: new Date().toISOString() };
    var p = edit.id ? sb.from("klas_quizzen").update(row).eq("id", edit.id) : sb.from("klas_quizzen").insert(row);
    p.then(function (r) {
      if (r.error) { btn.disabled = false; say("Opslaan lukte niet. Probeer het opnieuw.", true); return; }
      edit = null; msg = "Opgeslagen. Barakallahu feek!"; msgErr = false; loadQuizzes();
    });
  }

  start();
})();
</script>
</body>
</html>
