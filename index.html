<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2D6A4F">
  <title>Islam Quiz – Leer en speel</title>
  <meta name="description" content="Een leuke Islamitische quiz in het Nederlands voor kinderen en volwassenen.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
:root {
  --emerald: #2d6a4f;
  --emerald-dark: #1b4332;
  --emerald-soft: #d8f3dc;
  --gold: #d9a05b;
  --gold-soft: #fbefd9;
  --mint: #74c69d;
  --bg: #faf8f5;
  --ink: #1f2a24;
  --muted: #66756c;
  --card: #ffffff;
  --line: #ece6dc;
  --ok: #2d6a4f;
  --ok-bg: #d8f3dc;
  --bad: #d9534f;
  --bad-bg: #fde3e1;
  --shadow: 0 6px 20px rgba(45, 106, 79, 0.10);
  --shadow-lift: 0 10px 28px rgba(45, 106, 79, 0.18);
  --accent: var(--emerald);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { font-size: 16px; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  color: var(--ink);
  background:
    radial-gradient(circle at 12% -5%, rgba(116, 198, 157, 0.28), transparent 38%),
    radial-gradient(circle at 105% 8%, rgba(217, 160, 91, 0.22), transparent 34%),
    var(--bg);
  background-attachment: fixed;
  line-height: 1.5;
}

#app {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px 16px 48px;
}

h1, h2, h3 { margin: 0; line-height: 1.2; }
p { margin: 0; }

.ic { flex: none; vertical-align: middle; }
.ic.fill { fill: currentColor; }

/* ───── Arabic typography ───── */
.arabic {
  font-family: "Amiri", "Scheherazade New", "Noto Naskh Arabic", "Traditional Arabic", serif;
  direction: rtl;
  unicode-bidi: isolate;
  text-align: right;
  font-size: 1.65rem;
  line-height: 2.25;
  white-space: pre-line;
  color: var(--emerald-dark);
}
.arabic-inline { font-size: 1.2em; }
.arabic.big { font-size: 2rem; text-align: center; }

/* ───── Buttons ───── */
.btn {
  appearance: none;
  border: 0;
  font: inherit;
  font-weight: 800;
  cursor: pointer;
  border-radius: 20px;
  padding: 14px 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: #fff;
  background: var(--emerald);
  box-shadow: 0 5px 0 var(--emerald-dark);
  transition: transform .12s ease, box-shadow .12s ease, filter .12s;
  text-align: center;
  -webkit-user-select: none; user-select: none;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--emerald-dark); }
.btn:focus-visible, .option:focus-visible, .cat-card:focus-visible, .icon-btn:focus-visible, .daily:focus-visible, .mode-card:focus-visible {
  outline: 3px solid var(--gold); outline-offset: 3px;
}
.btn.gold { background: var(--gold); box-shadow: 0 5px 0 #a8742f; color: #3a2606; }
.btn.gold:active { box-shadow: 0 1px 0 #a8742f; }
.btn.ghost { background: #fff; color: var(--emerald-dark); box-shadow: 0 5px 0 var(--line); border: 2px solid var(--line); }
.btn.ghost:active { box-shadow: 0 1px 0 var(--line); }
.btn.block { width: 100%; }

.icon-btn {
  appearance: none; border: 0; background: #fff; color: var(--emerald-dark);
  width: 44px; height: 44px; border-radius: 16px;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; box-shadow: var(--shadow);
  transition: transform .12s ease;
}
.icon-btn:active { transform: scale(.88); }

/* ───── Welcome (level selection) ───── */
.welcome { text-align: center; padding-top: 12px; animation: fadeUp .5s ease both; }
.logo {
  width: 84px; height: 84px; margin: 8px auto 12px;
  border-radius: 28px;
  background: linear-gradient(135deg, var(--emerald), var(--mint));
  color: #fff; display: grid; place-items: center;
  box-shadow: var(--shadow-lift);
  transform: rotate(-6deg);
  animation: wobble 4s ease-in-out infinite;
}
.welcome h1 { font-size: 2rem; color: var(--emerald-dark); }
.welcome .greet { margin-top: 6px; color: var(--muted); font-weight: 600; }
.welcome .arabic { text-align: center; font-size: 1.9rem; line-height: 2; margin-top: 6px; }
.welcome h2 { margin: 22px 0 12px; font-size: 1.15rem; color: var(--emerald-dark); }

.mode-grid { display: grid; gap: 14px; }
.mode-card {
  text-align: left; font: inherit; cursor: pointer;
  border: 3px solid transparent;
  background: var(--card);
  border-radius: 28px; padding: 18px;
  display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center;
  box-shadow: var(--shadow);
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s;
}
.mode-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
.mode-card:active { transform: scale(.97); }
.mode-card .badge {
  width: 64px; height: 64px; border-radius: 22px; display: grid; place-items: center; color: #fff;
}
.mode-card.junior .badge { background: linear-gradient(135deg, var(--gold), #f0c27f); }
.mode-card.expert .badge { background: linear-gradient(135deg, var(--emerald), var(--mint)); }
.mode-card h3 { font-size: 1.2rem; color: var(--emerald-dark); }
.mode-card .sub { font-weight: 800; font-size: .85rem; color: var(--gold); text-transform: uppercase; letter-spacing: .04em; }
.mode-card.expert .sub { color: var(--emerald); }
.mode-card p { color: var(--muted); font-size: .95rem; margin-top: 4px; }

/* ───── Home ───── */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 1.25rem; color: var(--emerald-dark); }
.brand .mini-logo { width: 40px; height: 40px; border-radius: 14px; background: linear-gradient(135deg, var(--emerald), var(--mint)); color: #fff; display: grid; place-items: center; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.mode-chip {
  appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: .85rem;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 14px; border-radius: 999px; color: #fff;
  box-shadow: var(--shadow);
}
.mode-chip.junior { background: var(--gold); color: #3a2606; }
.mode-chip.expert { background: var(--emerald); }
.mode-chip:active { transform: scale(.94); }

.hello { margin: 4px 0 14px; }
.hello h1 { font-size: 1.6rem; color: var(--emerald-dark); }
.hello p { color: var(--muted); font-weight: 600; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.stat {
  background: var(--card); border-radius: 22px; padding: 12px 8px; text-align: center; box-shadow: var(--shadow);
  animation: fadeUp .5s ease both;
}
.stat .ic { margin-bottom: 2px; }
.stat b { display: block; font-size: 1.5rem; line-height: 1.1; color: var(--emerald-dark); }
.stat span { font-size: .78rem; color: var(--muted); font-weight: 700; }
.stat.streak .ic { color: #f08a3c; }
.stat.stars .ic { color: var(--gold); }
.stat.played .ic { color: var(--emerald); }

.daily {
  width: 100%; border: 0; cursor: pointer; font: inherit; text-align: left;
  color: #3a2606;
  background: linear-gradient(135deg, #f6c27a, var(--gold));
  border-radius: 28px; padding: 18px 18px;
  display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center;
  box-shadow: 0 6px 0 #a8742f, var(--shadow);
  transition: transform .12s ease, box-shadow .12s ease;
  margin-bottom: 18px;
}
.daily:active { transform: translateY(5px); box-shadow: 0 1px 0 #a8742f; }
.daily .badge { width: 56px; height: 56px; border-radius: 20px; background: rgba(255,255,255,.55); display: grid; place-items: center; }
.daily h2 { font-size: 1.15rem; }
.daily p { font-size: .9rem; font-weight: 700; opacity: .85; }
.daily .go { background: #fff; border-radius: 50%; width: 40px; height: 40px; display: grid; place-items: center; color: #a8742f; }
.daily.done { background: linear-gradient(135deg, #f2e2c6, #e7cfa4); }

.section-title { font-size: 1.05rem; font-weight: 900; color: var(--emerald-dark); margin: 4px 2px 10px; display: flex; align-items: center; gap: 8px; }

.timer-toggle {
  display: flex; align-items: center; gap: 12px; background: var(--card);
  border-radius: 22px; padding: 12px 16px; box-shadow: var(--shadow); margin-bottom: 18px;
}
.timer-toggle .txt { flex: 1; font-weight: 800; color: var(--emerald-dark); }
.timer-toggle .txt small { display: block; color: var(--muted); font-weight: 600; font-size: .8rem; }
.switch { position: relative; width: 54px; height: 32px; flex: none; }
.switch input { appearance: none; -webkit-appearance: none; width: 100%; height: 100%; margin: 0; border-radius: 999px; background: #d9d4ca; cursor: pointer; transition: background .2s; }
.switch input:checked { background: var(--emerald); }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .2s; pointer-events: none; }
.switch:has(input:checked)::after { transform: translateX(22px); }

.cat-grid { display: grid; gap: 12px; }
.cat-card {
  border: 0; font: inherit; text-align: left; cursor: pointer; width: 100%;
  background: var(--card); border-radius: 26px; padding: 14px 16px;
  display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center;
  box-shadow: var(--shadow);
  border-left: 8px solid var(--accent);
  transition: transform .15s ease, box-shadow .15s ease;
  animation: fadeUp .5s ease both;
}
.cat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
.cat-card:active { transform: scale(.97); }
.cat-card .badge { width: 56px; height: 56px; border-radius: 20px; display: grid; place-items: center; color: #fff; background: var(--accent); }
.cat-card h3 { font-size: 1.05rem; color: var(--emerald-dark); }
.cat-card p { font-size: .85rem; color: var(--muted); font-weight: 600; }
.cat-card .meta { text-align: right; }
.mini-stars { display: inline-flex; gap: 1px; color: #e3ddd0; }
.mini-stars .on { color: var(--gold); }
.cat-card .best { font-size: .75rem; font-weight: 800; color: var(--muted); margin-top: 2px; }
.cat-card .done-tick { color: var(--ok); }

.footer-actions { margin-top: 26px; display: flex; justify-content: center; }
.link-btn { background: none; border: 0; font: inherit; color: var(--muted); font-weight: 700; text-decoration: underline; cursor: pointer; padding: 8px; }

/* ───── Quiz ───── */
.quiz-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.cat-badge {
  display: inline-flex; align-items: center; gap: 6px; flex: 1; min-width: 0;
  background: var(--accent); color: #fff; border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: .85rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.score-pill {
  display: inline-flex; align-items: center; gap: 6px; background: var(--gold-soft); color: #7a4d0f;
  border-radius: 999px; padding: 8px 14px; font-weight: 900; font-size: .9rem;
}
.score-pill.bump { animation: pop .4s ease; }

.progress-row { display: flex; align-items: center; justify-content: space-between; font-weight: 800; font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
.bar { height: 14px; background: #ece6dc; border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--mint), var(--emerald)); transition: width .45s cubic-bezier(.3,1.2,.5,1); }
.timer { margin-top: 8px; height: 8px; }
.timer > i { background: linear-gradient(90deg, var(--gold), #e9724c); transition: none; }
.timer-label { font-size: .8rem; font-weight: 800; color: #b5651f; display: flex; align-items: center; gap: 4px; margin-top: 4px; }

.q-card {
  position: relative; background: var(--card); border-radius: 30px; padding: 20px 18px;
  box-shadow: var(--shadow); margin: 16px 0; animation: fadeUp .35s ease both;
  overflow: hidden;
}
.q-card .q-num { font-size: .8rem; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; color: var(--gold); }
.q-card h2 { font-size: 1.28rem; color: var(--ink); margin-top: 4px; }
.q-card .arabic { text-align: center; background: var(--emerald-soft); border-radius: 20px; padding: 6px 12px; margin-top: 14px; font-size: 1.9rem; }
.expert .q-card h2 { font-size: 1.18rem; }

.options { display: grid; gap: 10px; }
.option {
  appearance: none; font: inherit; text-align: left; cursor: pointer; width: 100%;
  display: grid; grid-template-columns: 38px 1fr 26px; gap: 12px; align-items: center;
  background: #fff; border: 3px solid var(--line); border-radius: 22px; padding: 12px 14px;
  font-weight: 700; color: var(--ink);
  box-shadow: 0 4px 0 var(--line);
  transition: transform .12s ease, box-shadow .12s ease, border-color .15s, background .15s;
  animation: fadeUp .4s ease both;
}
.option .letter { width: 38px; height: 38px; border-radius: 14px; background: var(--emerald-soft); color: var(--emerald-dark); display: grid; place-items: center; font-weight: 900; }
.option .mark { display: none; }
.option:hover:not(:disabled) { border-color: var(--mint); }
.option:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--line); }
.option:disabled { cursor: default; }
.option.correct { background: var(--ok-bg); border-color: var(--ok); box-shadow: 0 4px 0 var(--ok); animation: pop .4s ease; }
.option.correct .letter { background: var(--ok); color: #fff; }
.option.wrong { background: var(--bad-bg); border-color: var(--bad); box-shadow: 0 4px 0 #e9a7a4; animation: shake .45s ease; }
.option.wrong .letter { background: var(--bad); color: #fff; }
.option.correct .mark, .option.wrong .mark { display: block; }
.option.correct .mark { color: var(--ok); }
.option.wrong .mark { color: var(--bad); }
.option.dim { opacity: .55; }

.feedback {
  border-radius: 24px; padding: 16px 18px; margin-top: 16px; animation: fadeUp .35s ease both;
  border: 3px solid transparent;
}
.feedback.good { background: var(--ok-bg); border-color: var(--mint); }
.feedback.bad { background: var(--bad-bg); border-color: #f1b3b0; }
.feedback .head { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 1.15rem; }
.feedback.good .head { color: var(--emerald-dark); }
.feedback.bad .head { color: #a53b37; }
.feedback .why { margin-top: 8px; font-weight: 600; }
.feedback .correct-is { margin-top: 8px; font-weight: 800; }

.ref {
  margin-top: 14px; background: #fffdf8; border: 2px dashed var(--gold); border-radius: 20px; padding: 10px 14px 12px;
}
.ref .ref-label { font-size: .75rem; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; color: #a8742f; display: flex; align-items: center; gap: 6px; }
.ref .tr { font-style: italic; font-weight: 600; color: #3b4a41; white-space: pre-line; }
.ref .src { margin-top: 6px; font-size: .82rem; font-weight: 800; color: var(--emerald); }

.next-row { margin-top: 16px; display: flex; justify-content: flex-end; }

/* burst stars */
.burst { position: absolute; inset: 0; pointer-events: none; display: grid; place-items: center; }
.burst span { position: absolute; color: var(--gold); animation: fly .9s ease-out forwards; opacity: 0; }
.praise-pop {
  position: absolute; top: 10px; right: 14px; background: var(--gold); color: #3a2606; font-weight: 900;
  padding: 6px 14px; border-radius: 999px; animation: pop .5s ease both; box-shadow: var(--shadow);
}

/* ───── Result ───── */
.result { text-align: center; animation: fadeUp .45s ease both; padding-top: 8px; }
.stars-row { display: flex; justify-content: center; gap: 6px; margin: 10px 0 4px; }
.stars-row .ic { color: #e3ddd0; transform: scale(.6); opacity: .5; }
.stars-row .ic.on { color: var(--gold); animation: starIn .6s cubic-bezier(.3,1.6,.5,1) both; }
.stars-row .ic.on:nth-child(2) { animation-delay: .25s; }
.stars-row .ic.on:nth-child(3) { animation-delay: .5s; }
.stars-row .ic:nth-child(2) { margin-top: -14px; }
.big-score { font-size: 3.2rem; font-weight: 900; color: var(--emerald-dark); line-height: 1.1; }
.big-score small { font-size: 1.3rem; color: var(--muted); }
.result h1 { font-size: 1.6rem; color: var(--emerald-dark); margin-top: 8px; }
.result .msg { color: var(--muted); font-weight: 700; margin-top: 6px; }
.result .arabic { text-align: center; font-size: 2rem; margin-top: 4px; }
.badge-new { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; background: var(--gold-soft); color: #7a4d0f; font-weight: 900; padding: 8px 14px; border-radius: 999px; animation: pop .6s ease both; }
.result-actions { display: grid; gap: 14px; margin-top: 24px; }

/* ───── Review ───── */
.review h1 { font-size: 1.4rem; color: var(--emerald-dark); margin: 6px 0 14px; }
.rev-item { background: var(--card); border-radius: 26px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; border-left: 8px solid var(--ok); }
.rev-item.bad { border-left-color: var(--bad); }
.rev-item .qn { font-size: .78rem; font-weight: 900; color: var(--gold); text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; gap: 6px; }
.rev-item h3 { font-size: 1.05rem; margin: 4px 0 8px; }
.rev-item .arabic { background: var(--emerald-soft); border-radius: 16px; padding: 4px 12px; text-align: center; margin-bottom: 8px; }
.rev-line { font-weight: 700; font-size: .95rem; display: flex; gap: 8px; align-items: flex-start; margin: 4px 0; }
.rev-line.ok { color: var(--emerald-dark); }
.rev-line.no { color: #a53b37; }
.rev-line .ic { margin-top: 3px; }
.rev-expl { margin-top: 8px; color: #3b4a41; font-weight: 600; font-size: .95rem; }

/* ───── Dialog ───── */
.dialog-wrap { position: fixed; inset: 0; background: rgba(27,67,50,.45); display: grid; place-items: center; padding: 20px; z-index: 50; animation: fade .2s ease both; }
.dialog { background: #fff; border-radius: 28px; padding: 22px; max-width: 380px; width: 100%; box-shadow: var(--shadow-lift); animation: pop .3s ease both; }
.dialog h3 { color: var(--emerald-dark); font-size: 1.2rem; }
.dialog p { color: var(--muted); font-weight: 600; margin: 8px 0 18px; }
.dialog .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ───── Animations ───── */
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { 0% { transform: scale(.85); } 55% { transform: scale(1.06); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@keyframes wobble { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(4deg) scale(1.04); } }
@keyframes starIn { 0% { transform: scale(.2) rotate(-40deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes fly { 0% { transform: translate(0,0) scale(.4) rotate(0); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1.1) rotate(160deg); opacity: 0; } }

.cat-card:nth-child(2) { animation-delay: .05s; }
.cat-card:nth-child(3) { animation-delay: .1s; }
.cat-card:nth-child(4) { animation-delay: .15s; }
.cat-card:nth-child(5) { animation-delay: .2s; }
.option:nth-child(2) { animation-delay: .04s; }
.option:nth-child(3) { animation-delay: .08s; }
.option:nth-child(4) { animation-delay: .12s; }

@media (min-width: 600px) {
  #app { padding-top: 28px; }
  .mode-grid { grid-template-columns: 1fr 1fr; }
  .mode-card { grid-template-columns: 1fr; text-align: center; justify-items: center; }
  .result-actions { grid-template-columns: repeat(3, 1fr); }
  .q-card h2 { font-size: 1.45rem; }
  .arabic { font-size: 1.85rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

.options.answered .option:not(.correct):not(.wrong) { animation: none; }
.q-card.static { animation: none; }

/* kleine schermen */
.cat-card { grid-template-columns: 56px minmax(0, 1fr) auto; }
.daily { grid-template-columns: 56px minmax(0, 1fr) auto; }
.cat-card h3, .cat-card p { overflow-wrap: anywhere; }
@media (max-width: 360px) {
  .cat-card, .daily { gap: 10px; padding: 12px; grid-template-columns: 46px minmax(0, 1fr) auto; }
  .cat-card .badge, .daily .badge { width: 46px; height: 46px; border-radius: 16px; }
  .cat-card .best { display: none; }
}

/* scores */

    }

    h += '<div class="q-card' + (quiz.answered ? " static" : "") + '" id="qcard"><div class="q-num">' + (isDaily ? "Dagelijkse vraag " : "Vraag ") + (quiz.idx + 1) + "</div>" +

      }
      h += '<button class="' + cls + '" data-act="answer" data-pos="' + pos + '" ' + (quiz.answered ? "disabled" : "") + ">" +

  function refHtml(ref) {
    if (!ref) return "";
    return '<div class="ref"><div class="ref-label">' + icon("book", 14) + "Arabische tekst</div>" + ar(ref.text) +
      '<div class="tr">' + esc(ref.translation) + "</div>" +

  const PRAISE = ["Masha’Allah!", "Super goed!", "Fantastisch!", "Barakallahu fiek!", "Wat slim!", "Geweldig!"];
  const TRYAGAIN = ["Bijna! Je leert het, Insha’Allah.", "Geen zorgen, we leren samen!", "Goed geprobeerd!"];
  let lastPraise = "", lastTry = "";

  function feedbackHtml(it) {
    const q = it.q, ok = it.correct, junior = quiz.level === "junior";
    const last = quiz.idx === quiz.items.length - 1;
    let head;
    if (ok) head = junior ? lastPraise : "Correct! Masha’Allah.";
    else if (it.timedOut) head = "De tijd is op!";
    else head = junior ? lastTry : "Helaas, niet juist.";
    let h = '<div class="feedback ' + (ok ? "good" : "bad") + '" id="feedback"><div class="head">' + icon(ok ? "check" : "x", 26) + "<span>" + esc(head) + "</span></div>";
    if (!ok) h += '<div class="correct-is">Het juiste antwoord: ' + esc(q.options[q.answer]) + "</div>";
    h += '<p class="why">' + esc(q.explanation) + "</p>" + refHtml(q.arabic) + "</div>";
    h += '<div class="next-row"><button class="btn ' + (last ? "gold" : "") + '" data-act="next" id="nextBtn">' +
      (last ? "Bekijk resultaat" : "Volgende vraag") + icon("right", 20) + "</button></div>";

  function afterQuizRender() {
    if (quiz.answered) {
      const fb = document.getElementById("feedback");
      if (fb && fb.scrollIntoView) setTimeout(function () { fb.scrollIntoView({ behavior: "smooth", block: "center" }); }, 80);
    } else if (quiz.level === "expert" && S.timer && quiz.kind !== "duel") startTimer();
  }

  function startTimer() {
    quiz.timeLeft = TIMER_SECONDS;
    const t0 = Date.now();
    timerHandle = setInterval(function () {
      const left = TIMER_SECONDS - (Date.now() - t0) / 1000;
      const bar = document.getElementById("timerBar"), txt = document.getElementById("timerTxt");
      if (left <= 0) { stopTimer(); answer(null); return; }
      if (bar) bar.style.width = (left / TIMER_SECONDS) * 100 + "%";
      if (txt) txt.textContent = Math.ceil(left) + " sec";
    }, 100);
  }

  function answer(pos) {
    if (!quiz || quiz.answered) return;
    stopTimer();
    const it = quiz.items[quiz.idx];
    it.timedOut = pos === null;
    it.picked = pos === null ? null : it.order[pos];
    it.correct = it.picked === it.q.answer;
    quiz.answered = true;
    if (quiz.kind === "duel") { quiz.ms += Date.now() - quiz.qStart; pushDuelProgress(); }
    if (it.correct) {
      quiz.score++;
      lastPraise = pick(PRAISE);
      play("correct");
    } else {
      lastTry = pick(TRYAGAIN);
      play("wrong");
    }
    render();
    if (it.correct) {
      const sp = document.getElementById("scorePill");
      if (sp) sp.classList.add("bump");
      if (quiz.level === "junior") burst();
    }
  }

  function burst() {
    const card = document.getElementById("qcard");
    if (!card) return;
    const wrap = document.createElement("div");
    wrap.className = "burst";
    for (let i = 0; i < 10; i++) {
      const a = (Math.PI * 2 * i) / 10, r = 90 + Math.random() * 50;
      const s = document.createElement("span");
      s.style.setProperty("--dx", Math.cos(a) * r + "px");
      s.style.setProperty("--dy", Math.sin(a) * r * 0.6 + "px");
      s.innerHTML = icon("star", 20 + Math.random() * 12, "fill");
      wrap.appendChild(s);
    }
    const pop = document.createElement("div");
    pop.className = "praise-pop"; pop.textContent = lastPraise;
    card.appendChild(wrap); card.appendChild(pop);
    setTimeout(function () { wrap.remove(); }, 1100);
  }

  function next() {
    if (!quiz || !quiz.answered) return;
    if (quiz.idx < quiz.items.length - 1) {
      quiz.idx++; quiz.answered = false; quiz.qStart = Date.now();
      play("click");
      render();
    } else if (quiz.kind === "duel") { play("win"); finishDuel(); }
    else finishQuiz();
  }

  function finishQuiz() {
    const total = quiz.items.length, score = quiz.score, stars = starsFor(score, total);
    let isRecord = false;

    if (quiz.kind === "daily") {
      const prev = P.daily[quiz.level][todayStr()];
      if (!prev || score > prev.score) P.daily[quiz.level][todayStr()] = { score: score, total: total };
    } else {
      const bk = bkey(quiz.catId, quiz.tier || 1), prev = P.best[quiz.level][bk];
      if (!prev || score > prev.score) {
        isRecord = !!prev || score === total; // nieuw record t.o.v. eerdere poging
        P.best[quiz.level][bk] = { score: score, total: total, stars: stars };
      }
    }
    P.played++;

    // reeks (streak): opeenvolgende dagen met minstens één afgeronde quiz
    const t = todayStr();
    if (P.streak.last !== t) {
      P.streak.count = P.streak.last === yesterdayStr() ? P.streak.count + 1 : 1;
      P.streak.last = t;
      P.streak.max = Math.max(P.streak.max || 0, P.streak.count);
    }
    saveState();
    pushMember();

    result = { kind: quiz.kind, catId: quiz.catId, level: quiz.level, tier: quiz.tier || 1, next: nextTier(quiz, stars), score: score, total: total, stars: stars, record: isRecord, items: quiz.items };
    screen = "result";
    play(stars >= 2 ? "win" : "lose");
    render();
  }

      return h;

  /* ───────────── Spelers ───────────── */
  function avatarHtml(p, size) {
    const initial = esc((p.name || "?").trim().charAt(0).toUpperCase());
    return '<span class="avatar" style="--c:' + p.color + ';width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size * 0.46) + 'px">' + initial + "</span>";
  }
  function starsAt(p, lv) {
    let t = 0; Object.keys(p.best[lv]).forEach(function (k) { t += p.best[lv][k].stars || 0; });
    return t;
  }
  function allStars(p) { return starsAt(p, "junior") + starsAt(p, "expert"); }
  function avgPct(p, lv) {
    const ks = Object.keys(p.best[lv]);
    if (!ks.length) return null;
    let t = 0; ks.forEach(function (k) { t += p.best[lv][k].score / p.best[lv][k].total; });
    return Math.round((t / ks.length) * 100);
  }
  function streakOf(p) { return p.streak.last === todayStr() || p.streak.last === yesterdayStr() ? p.streak.count : 0; }

  function viewNewPlayer() {
    const first = S.players.length === 0;

  function loadAuth() { try { return JSON.parse(localStorage.getItem(AUTH_KEY)); } catch (e) { return null; } }

  function cloudAuth() {
    if (!cloud.auth) cloud.auth = loadAuth();
    const a = cloud.auth;
    if (a && a.exp > Date.now() + 60000) return Promise.resolve(a);
    if (cloud.pending) return cloud.pending;
    cloud.pending = (async function () {
      try {
        if (a && a.refreshToken) {

            method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(a.refreshToken),
          });
          if (r.ok) {
            const j = await r.json();
            cloud.auth = { idToken: j.id_token, refreshToken: j.refresh_token, uid: j.user_id, exp: Date.now() + (parseInt(j.expires_in, 10) || 3600) * 1000 };
            saveAuth(cloud.auth); return cloud.auth;
          }
        }
        const r2 = await fetch(FB.signUpUrl + "?key=" + FB.apiKey, {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ returnSecureToken: true }),
        });
        if (!r2.ok) { const e = new Error("auth"); e.status = r2.status; throw e; }
        const j2 = await r2.json();
        cloud.auth = { idToken: j2.idToken, refreshToken: j2.refreshToken, uid: j2.localId, exp: Date.now() + (parseInt(j2.expiresIn, 10) || 3600) * 1000 };
        saveAuth(cloud.auth); return cloud.auth;
      } finally { cloud.pending = null; }
    })();
    return cloud.pending;
  }

  async function dbReq(method, path, body, query) {
    const auth = await cloudAuth();
    const url = FB.db + "/" + path + ".json?auth=" + encodeURIComponent(auth.idToken) + (query ? "&" + query : "");
    const opt = { method: method };
    if (body !== undefined) { opt.headers = { "Content-Type": "application/json" }; opt.body = JSON.stringify(body); }
    const r = await fetch(url, opt);
    if (!r.ok) { const e = new Error("db " + r.status); e.status = r.status; throw e; }
    return r.json();
  }

  /* live luisteren naar een pad; geeft {close()} terug */
  function listen(path, onData, onState) {
    let es = null, cache = null, closed = false, timer = null;
    function setAt(p, val) {
      const parts = String(p).split("/").filter(Boolean);
      if (!parts.length) { cache = val; return; }
      if (cache === null || typeof cache !== "object") cache = {};
      let node = cache;
      for (let i = 0; i < parts.length - 1; i++) {
        if (node[parts[i]] === null || typeof node[parts[i]] !== "object") node[parts[i]] = {};
        node = node[parts[i]];
      }
      const last = parts[parts.length - 1];
      if (val === null) delete node[last]; else node[last] = val;
    }
    async function open() {
      if (closed) return;
      try {
        const auth = await cloudAuth();
        if (closed) return;
        es = new EventSource(FB.db + "/" + path + ".json?auth=" + encodeURIComponent(auth.idToken));
        es.addEventListener("put", function (e) {
          const m = JSON.parse(e.data); setAt(m.path, m.data);
          if (onState) onState("online"); onData(cache);
        });
        es.addEventListener("patch", function (e) {
          const m = JSON.parse(e.data);
          Object.keys(m.data || {}).forEach(function (k) { setAt((m.path === "/" ? "" : m.path) + "/" + k, m.data[k]); });
          onData(cache);
        });
        es.addEventListener("auth_revoked", function () { reopen(); });
        es.addEventListener("cancel", function () { reopen(); });
        es.onerror = function () { if (onState) onState("offline"); reopen(); };
      } catch (err) { if (onState) onState("offline"); reopen(); }
    }
    function reopen() {
      if (es) { es.close(); es = null; }
      if (closed || timer) return;
      timer = setTimeout(function () { timer = null; cache = null; open(); }, 3000);
    }
    open();
    return { close: function () { closed = true; if (es) es.close(); if (timer) clearTimeout(timer); } };
  }

  /* groepscode */
  function normCode(s) { return String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6); }
  function showCode(c) { return c.length > 3 ? c.slice(0, 3) + "-" + c.slice(3) : c; }
  function genCode() {
    const a = new Uint32Array(6);
    (window.crypto || window.msCrypto).getRandomValues(a);
    let c = ""; for (let i = 0; i < 6; i++) c += CODE_CHARS[a[i] % CODE_CHARS.length];
    return c;
  }

  function memberPayload(p) {
    const best = { junior: {}, expert: {} };
    ["junior", "expert"].forEach(function (lv) {
      Object.keys(p.best[lv]).forEach(function (k) { best[lv][k] = Math.round((p.best[lv][k].score / p.best[lv][k].total) * 100); });
    });
    const day = {};
    ["junior", "expert"].forEach(function (lv) { const d = p.daily[lv][todayStr()]; if (d) day[lv] = d.score + "/" + d.total; });
    const o = {
      name: p.name, color: p.color, updated: SV, played: p.played, streak: streakOf(p), day: todayStr(),
      stars: { junior: starsAt(p, "junior"), expert: starsAt(p, "expert") }, best: best, daily: day,
    };
    ["junior", "expert"].forEach(function (lv) { const a = avgPct(p, lv); if (a !== null) { o.avg = o.avg || {}; o.avg[lv] = a; } });
    return o;
  }

  async function pushMember() {
    if (!P || !P.group) return;
    try { await dbReq("PUT", "groups/" + P.group.code + "/members/" + P.group.mid, memberPayload(P)); } catch (e) { /* offline: volgende keer */ }
  }

  async function createGroup() {
    const auth = await cloudAuth();
    for (let i = 0; i < 6; i++) {
      const code = genCode();
      try {
        await dbReq("PUT", "groups/" + code + "/meta", { created: SV, owner: auth.uid, v: 1 });
      } catch (e) { if (e.status === 401 || e.status === 403) continue; throw e; }
      P.group = { code: code, mid: auth.uid + "-" + P.id }; saveState();
      await dbReq("PUT", "groups/" + code + "/members/" + P.group.mid, memberPayload(P));
      return code;
    }
    throw new Error("geen vrije code");
  }

  async function joinGroup(code) {
    const auth = await cloudAuth();
    const meta = await dbReq("GET", "groups/" + code + "/meta");
    if (!meta) { const e = new Error("niet gevonden"); e.kind = "notfound"; throw e; }
    const mid = auth.uid + "-" + P.id;
    const keys = (await dbReq("GET", "groups/" + code + "/members", undefined, "shallow=true")) || {};
    if (Object.keys(keys).length >= MAX_GROUP && !keys[mid]) { const e = new Error("vol"); e.kind = "full"; throw e; }
    P.group = { code: code, mid: mid }; saveState();
    await dbReq("PUT", "groups/" + code + "/members/" + mid, memberPayload(P));
  }

  async function leaveGroup(player) {
    const g = player.group; if (!g) return;
    player.group = null; saveState();
    try {
      await dbReq("DELETE", "groups/" + g.code + "/members/" + g.mid);
      const left = await dbReq("GET", "groups/" + g.code + "/members", undefined, "shallow=true");
      if (!left || !Object.keys(left).length) {
        await dbReq("DELETE", "groups/" + g.code + "/duel");
        await dbReq("DELETE", "groups/" + g.code + "/meta");
      }
    } catch (e) { /* offline: de lokale koppeling is al verwijderd */ }
  }

  /* ── groepsscherm: live data ── */
  let groupSub = null, groupData = null, groupLoaded = false, cloudStatus = "", groupMsg = "", groupBusy = false, startedDuelId = null;
  let pendingCode = normCode(new URLSearchParams(location.search).get("groep"));

  function openGroupSub() {
    if (groupSub || !P || !P.group) return;
    cloudStatus = "connecting"; groupLoaded = false;
    groupSub = listen("groups/" + P.group.code, onGroupData, function (st) {
      if (st !== cloudStatus) { cloudStatus = st; if (screen === "group") render(); }
    });
  }
  function closeGroupSub() { if (groupSub) { groupSub.close(); groupSub = null; } groupData = null; groupLoaded = false; }

  function activeDuel() {
    const d = groupData && groupData.duel;
    if (!d || !d.id) return null;
    if (typeof d.created === "number" && Date.now() - d.created > 3 * 3600 * 1000) return null;
    return d;
  }
  function duelPlayers(d) {
    return Object.keys((d && d.players) || {}).map(function (k) { const p = d.players[k]; p.mid = k; return p; });
  }
  function isStale(p, d) { return d.status !== "done" && !p.done && Date.now() - (p.t || 0) > 120000; }

  function onGroupData(data) {
    groupData = data; groupLoaded = true; cloudStatus = "online";
    const d = activeDuel(), mid = P && P.group && P.group.mid;
    if (d && mid) {
      const me = d.players && d.players[mid];
      if (d.status === "playing" && me && startedDuelId !== d.id && screen === "group") {
        startedDuelId = d.id; startDuelQuiz(d); return;
      }
      if (d.status === "playing" && d.host === mid) {
        const ps = duelPlayers(d).filter(function (p) { return !isStale(p, d); });
        if (ps.length && ps.every(function (p) { return p.done; })) dbReq("PATCH", "groups/" + P.group.code + "/duel", { status: "done" }).catch(function () {});
      }
    }
    if (screen === "group" || screen === "duelresult") render();
    else if (screen === "quiz" && quiz && quiz.kind === "duel") updateOppStrip();
  }

  /* ── duel ── */
  function duelItems(seed, level, n, tier) {
    const rnd = mulberry32(seed), picked = [], used = {};
    shuffle(CATEGORIES, rnd).forEach(function (c) {
      const p = shuffle(poolFor(level, c.id, tier), rnd);
      if (p.length) { picked.push(p[0]); used[p[0].id] = true; }
    });
    const rest = shuffle(poolFor(level, null, tier).filter(function (q) { return !used[q.id]; }), rnd);
    while (picked.length < n && rest.length) picked.push(rest.shift());
    return shuffle(picked, rnd).slice(0, n).map(function (q) {
      return { q: q, order: shuffle([0, 1, 2, 3], rnd), picked: null, correct: null, timedOut: false };
    });
  }
  function duelPlayerObj() { return { name: P.name, color: P.color, idx: 0, score: 0, ms: 0, done: false, t: Date.now() }; }

  let duelTier = 1;
  function duelTiers() { return tiersFor(P.mode || "junior"); }
  function duelTierNow() { return duelTiers().indexOf(duelTier) >= 0 ? duelTier : 1; }
  function tierPickHtml() {
    const ts = duelTiers(); if (ts.length < 2) return "";
    return '<div class="tier-pick" role="group" aria-label="Niveau van de duel"><span>Niveau</span>' + ts.map(function (t) {
      return '<button class="tier-chip' + (t === duelTierNow() ? " on" : "") + '" data-act="duel-tier" data-tier="' + t + '">' + t + "</button>";
    }).join("") + "</div>";
  }
  async function startDuel() {
    const g = P.group;
    const duel = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), host: g.mid, hostName: P.name, status: "lobby",
      level: P.mode || "junior", tier: duelTierNow(), seed: Math.floor(Math.random() * 2147483647), n: Math.min(DUEL_N, poolFor(P.mode || "junior", null, duelTierNow()).length), qv: QV, created: SV,
      players: {},
    };
    duel.players[g.mid] = duelPlayerObj();
    await dbReq("PUT", "groups/" + g.code + "/duel", duel);
  }
  async function joinDuel() { await dbReq("PUT", "groups/" + P.group.code + "/duel/players/" + P.group.mid, duelPlayerObj()); }
  async function beginDuel() { await dbReq("PATCH", "groups/" + P.group.code + "/duel", { status: "playing", startedAt: SV }); }
  async function stopDuel() { await dbReq("PATCH", "groups/" + P.group.code + "/duel", { status: "done" }); }

  function startDuelQuiz(d) {
    if (d.qv !== QV) { groupMsg = "Deze duel gebruikt andere vragen. Ververs de app (sluit en open opnieuw) en probeer het nog eens."; screen = "group"; render(); return; }
    quiz = {
      kind: "duel", catId: null, level: d.level, tier: d.tier || 1, items: duelItems(d.seed, d.level, d.n, d.tier || 1), idx: 0, score: 0,
      answered: false, timeLeft: 0, ms: 0, qStart: Date.now(), duelId: d.id,
    };
    screen = "quiz"; render();
  }
  function pushDuelProgress() {
    if (!quiz || quiz.kind !== "duel" || !P.group) return;
    const done = quiz.idx + 1 >= quiz.items.length;
    const body = { idx: quiz.idx + 1, score: quiz.score, ms: quiz.ms, done: done, t: Date.now() };
    const path = "groups/" + P.group.code + "/duel/players/" + P.group.mid;
    dbReq("PATCH", path, body).catch(function () { if (done) setTimeout(function () { dbReq("PATCH", path, body).catch(function () {}); }, 2500); });
  }
  function finishDuel() { screen = "duelresult"; render(); }

  function oppStripHtml() {
    const d = activeDuel(); if (!d || !quiz) return "";
    const total = d.n || quiz.items.length, mid = P.group.mid;
    return duelPlayers(d).filter(function (p) { return p.mid !== mid; }).map(function (p) {
      const pct = Math.min(100, Math.round(((p.idx || 0) / total) * 100));
      return '<div class="opp"><span class="opp-name">' + avatarHtml(p, 22) + esc(p.name) + '</span><span class="opp-bar"><i style="width:' + pct + '%;background:' + esc(p.color || "#74c69d") + '"></i></span>' +
        '<span class="opp-score">' + (p.done ? "klaar · " : "") + (p.score || 0) + " goed</span></div>";
    }).join("");
  }
  function updateOppStrip() { const el = document.getElementById("oppStrip"); if (el) el.innerHTML = oppStripHtml(); }


  /* ───────────── Installeren als app ───────────── */
  let deferredInstall = null;
  function isStandalone() {
    return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
  }
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferredInstall = e; });
  window.addEventListener("appinstalled", function () { deferredInstall = null; if (screen === "home") render(); });

  function infoDialog(title, html) {
    const w = document.createElement("div");
    w.className = "dialog-wrap";
    w.innerHTML = '<div class="dialog" role="dialog" aria-modal="true"><h3>' + esc(title) + "</h3><div class=\"dialog-body\">" + html + '</div><button class="btn block" data-d="ok">Begrepen</button></div>';
    w.addEventListener("click", function (e) { if (e.target === w || e.target.closest("[data-d]")) w.remove(); });
    document.body.appendChild(w);
    const b = w.querySelector("button"); if (b) b.focus();
  }
  function installHelp() {
    const ua = navigator.userAgent || "";
    const ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const android = /Android/.test(ua);
    let steps;
    if (ios) steps = ["Open deze pagina in <b>Safari</b>.", "Tik op de knop <b>Deel</b> (vierkant met pijl omhoog).", "Kies <b>Zet op beginscherm</b>.", "Tik op <b>Voeg toe</b>."];
    else if (android) steps = ["Open deze pagina in <b>Chrome</b>.", "Tik rechtsboven op het menu <b>⋮</b>.", "Kies <b>App installeren</b> of <b>Toevoegen aan startscherm</b>.", "Bevestig met <b>Installeren</b>."];
    else steps = ["Gebruik <b>Chrome</b> of <b>Edge</b>.", "Klik rechts in de adresbalk op het <b>installeer-icoon</b>, of open het menu.", "Kies <b>Islam Quiz installeren</b>."];
    infoDialog("Zet Islam Quiz op je beginscherm", "<ol>" + steps.map(function (t) { return "<li>" + t + "</li>"; }).join("") + "</ol><p>Daarna opent de quiz als een gewone app, ook zonder internet.</p>");
  }

  /* ───────────── Events ───────────── */
  document.addEventListener("click", function (e) {
    const el = e.target.closest("[data-act]");
    if (!el || el.tagName === "INPUT") return;
    const act = el.dataset.act;
    switch (act) {
      case "pick-mode": P.mode = el.dataset.mode; saveState(); play("click"); screen = pendingCode ? "group" : "home"; render(); break;
      case "switch-mode": P.mode = P.mode === "junior" ? "expert" : "junior"; saveState(); play("click"); render(); break;
      case "toggle-sound": S.sound = !S.sound; saveState(); if (S.sound) play("click"); render(); break;
      case "start-cat":
        play("click");
        if (tiersFor(P.mode, el.dataset.cat).length > 1) tierDialog(el.dataset.cat); else startQuiz("category", el.dataset.cat, 1);
        break;
      case "start-tier": { play("click"); const dw = document.querySelector(".dialog-wrap"); if (dw) dw.remove(); startQuiz("category", el.dataset.cat, parseInt(el.dataset.tier, 10)); break; }
      case "go-next-tier": play("click"); stopTimer(); startQuiz("category", result.catId, result.next); break;
      case "start-daily": play("click"); startQuiz("daily"); break;
      case "answer": answer(parseInt(el.dataset.pos, 10)); break;
      case "next": next(); break;
      case "retry":
        play("click");
        if (result && result.kind === "daily") startQuiz("daily"); else startQuiz("category", result.catId, result.tier);
        break;
      case "home": play("click"); stopTimer(); screen = "home"; render(); break;
      case "scores": play("click"); screen = "scores"; render(); break;
      case "review": play("click"); if (result) result.noAuto = true; screen = "review"; render(); break;
      case "back-result": screen = "result"; render(); break;
      case "leave":
        stopTimer();
        confirmDialog("Quiz stoppen?", quiz && quiz.kind === "duel" ? "Je verlaat de duel. De anderen spelen verder." : "Je voortgang in deze ronde gaat verloren.", "Ja, stoppen", function () { screen = quiz && quiz.kind === "duel" ? "group" : "home"; render(); });
        if (quiz && !quiz.answered && quiz.level === "expert" && S.timer && quiz.kind !== "duel") { /* timer is gepauzeerd; herstart bij annuleren */
          const d = document.querySelector(".dialog-wrap");
          if (d) d.addEventListener("click", function (ev) { if (ev.target.closest('[data-d="no"]') || ev.target === d) { if (screen === "quiz" && !quiz.answered) startTimer(); } });
        }
        break;
      case "reset":
        confirmDialog("Voortgang wissen?", "Alle scores, sterren en de reeks van " + P.name + " worden verwijderd. Andere spelers blijven staan.", "Ja, wissen", function () {
          const fresh = newPlayer(P.name, P.color);
          P.best = fresh.best; P.daily = fresh.daily; P.streak = fresh.streak; P.played = 0; saveState(); render();
        });
        break;
      case "install":
        if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; } else installHelp();
        break;
      case "players": play("click"); stopTimer(); screen = "players"; render(); break;
      case "add-player": play("click"); draftColor = AVATAR_COLORS[S.players.length % AVATAR_COLORS.length]; screen = "newplayer"; render(); break;
      case "pick-color":
        draftColor = el.dataset.color;
        document.querySelectorAll(".swatch").forEach(function (b) { const on = b.dataset.color === draftColor; b.classList.toggle("on", on); b.setAttribute("aria-checked", on); });
        break;
      case "create-player": createPlayer(); break;
      case "select-player": play("click"); selectPlayer(el.dataset.id); break;
      case "remove-player": {
        const victim = S.players.find(function (p) { return p.id === el.dataset.id; });
        if (!victim) break;
        confirmDialog("Speler verwijderen?", "Alle scores van " + victim.name + " worden gewist. Dit kan niet ongedaan gemaakt worden.", "Ja, verwijderen", function () {
          closeGroupSub(); leaveGroup(victim);
          S.players = S.players.filter(function (p) { return p.id !== victim.id; });
          if (S.current === victim.id) { S.current = S.players[0].id; P = currentPlayer(); }
          saveState(); render();
        });
        break;
      }
      case "group": play("click"); groupMsg = ""; screen = "group"; render(); break;
      case "group-back": play("click"); groupMsg = ""; screen = "group"; render(); break;
      case "group-create": play("click"); runCloud(function () { return createGroup().then(function () { pendingCode = ""; }); }); break;
      case "group-join": {
        const inp = document.getElementById("gcode");
        pendingCode = normCode(inp ? inp.value : pendingCode);
        if (pendingCode.length !== 6) { groupMsg = "Een groepscode heeft 6 tekens, bijvoorbeeld KRM-7QX."; render(); break; }
        play("click");
        const code = pendingCode;
        runCloud(function () { return joinGroup(code).then(function () { pendingCode = ""; }); });
        break;
      }
      case "copy-code": {
        const txt = shareText(P.group.code);
        const done = function () { const b = el; b.textContent = "Gekopieerd!"; setTimeout(function () { if (b.isConnected) b.textContent = "Kopieer"; }, 1600); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { window.prompt("Kopieer deze tekst:", txt); });
        else window.prompt("Kopieer deze tekst:", txt);
        break;
      }
      case "group-leave":
        confirmDialog("Groep verlaten?", "Je verdwijnt uit het scorebord van de groep. Je eigen scores op dit toestel blijven staan.", "Ja, verlaten", function () {
          closeGroupSub(); const who = P; leaveGroup(who); startedDuelId = null; groupMsg = ""; render();
        });
        break;
      case "group-leave-now": closeGroupSub(); leaveGroup(P); groupMsg = ""; render(); break;
      case "duel-start": play("click"); runCloud(startDuel); break;
      case "duel-tier": play("click"); duelTier = parseInt(el.dataset.tier, 10); render(); break;
      case "duel-join": play("click"); runCloud(joinDuel); break;
      case "duel-begin": play("click"); runCloud(beginDuel); break;
      case "duel-stop": runCloud(stopDuel); break;
      case "duel-open": {
        const d = activeDuel(), me = d && d.players && d.players[P.group.mid];
        play("click");
        if (d && me && d.status === "playing" && !me.done) {
          if (quiz && quiz.kind === "duel" && quiz.duelId === d.id) { screen = "quiz"; render(); }
          else { startedDuelId = d.id; startDuelQuiz(d); }
        } else { screen = "duelresult"; render(); }
        break;
      }
      case "board": play("click"); boardLevel = (P && P.mode) || boardLevel; screen = "board"; render(); break;
      case "board-level": boardLevel = el.dataset.level; render(); break;
    }
  });

  document.addEventListener("change", function (e) {
    const el = e.target;
    if (el && el.dataset && el.dataset.act === "toggle-timer") { S.timer = el.checked; saveState(); play("click"); }
  });

  document.addEventListener("keydown", function (e) {
    if (screen === "newplayer" && e.key === "Enter") { createPlayer(); return; }
    if (screen !== "quiz" || !quiz || document.querySelector(".dialog-wrap")) return;
    if (!quiz.answered && /^[1-4]$/.test(e.key)) answer(parseInt(e.key, 10) - 1);
    else if (quiz.answered && e.key === "Enter" && document.activeElement.tagName !== "BUTTON") next();
  });

  // zorg dat geluid werkt op mobiel na de eerste aanraking
  document.addEventListener("pointerdown", function () { if (S.sound) ctx(); }, { once: true });

  render();
})();

</script>
<script>
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
